name: HabotConnect CI / Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (Python 3.12 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habotconnect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      USE_SQLITE: "False"
      DATABASE_NAME: habotconnect_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      SECRET_KEY: ci-test-secret-key-habotconnect
      DEBUG: "False"
      PAYMENT_API_URL: https://api.habotconnect-mock-payment.com/v1/charge

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Django Configuration
        run: |
          python manage.py check

      - name: Check Migration File Consistency
        run: |
          python manage.py makemigrations --check

      - name: Execute Database Migrations
        run: |
          python manage.py migrate

      - name: Run Pytest Test Suite
        run: |
          pytest --cov=bookings
